# ~/.tmux.conf — no plugin manager, nothing to install.

# ---------------------------------------------------------------------------
# General
# ---------------------------------------------------------------------------

# ctrl-a is easier to reach than ctrl-b and does not fight with vim.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-256color:Tc"

set -g history-limit 50000
set -sg escape-time 10          # no delay for the escape key in vim
set -g focus-events on
set -g mouse on
setw -g aggressive-resize on

# Windows and panes count from 1: the 0 key is a long reach.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g set-titles on
set -g set-titles-string "#S / #W"
set -g display-time 2000
set -g status-interval 5

# ---------------------------------------------------------------------------
# Key bindings
# ---------------------------------------------------------------------------

bind r source-file ~/.tmux.conf \; display "reloaded ~/.tmux.conf"

# Split panes in the current directory, with intuitive keys.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation and resizing.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Alt-arrow to switch panes without the prefix.
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift-arrow to switch windows without the prefix.
bind -n S-Left previous-window
bind -n S-Right next-window

bind S choose-session
bind X kill-pane
bind Z kill-session

# ---------------------------------------------------------------------------
# Copy mode (vi keys, system clipboard)
# ---------------------------------------------------------------------------

setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

if-shell "command -v xclip" \
  "bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -selection clipboard -in'"
if-shell "uname | grep -q Darwin" \
  "bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'"

# ---------------------------------------------------------------------------
# Status line
# ---------------------------------------------------------------------------

set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default,fg=colour245"

set -g status-left-length 40
set -g status-left "#[fg=colour114,bold] #S #[fg=colour240]| "
set -g status-right-length 80
set -g status-right "#[fg=colour245]#{?client_prefix,#[fg=colour203]● ,}#[fg=colour245]%Y-%m-%d %H:%M #[fg=colour114]#h "

setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[fg=colour114,bold] #I #W "
setw -g window-status-current-style "fg=colour114"

set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour114"
set -g message-style "bg=colour114,fg=colour232"
